name: CI

# Deterministic static verification for the Nullworx foundation.
# Browser evidence stays outside CI until a pinned browser install and a
# managed server lifecycle are part of the workflow.
on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "1"

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install from the frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate the component registry
        run: pnpm registry:validate

      - name: Run the effect contract checks
        run: pnpm verify:contract

      - name: Production build
        run: pnpm build
